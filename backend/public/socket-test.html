<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Socket test</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 20px auto; padding: 0 12px; }
    textarea { width: 100%; height: 80px; }
    #log { background: #111; color: #0f0; padding: 10px; height: 320px; overflow: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
    button { padding: 8px 14px; margin-top: 6px; }
  </style>
</head>
<body>
  <h3>Socket.IO test</h3>
  <p>Paste a donor or hospital token, then connect.</p>
  <textarea id="token" placeholder="eyJ..."></textarea><br>
  <button id="connect">Connect</button>
  <button id="disconnect">Disconnect</button>
  <p id="status">Not connected</p>
  <div id="log"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/socket-test.js"></script>
</body>
</html>
